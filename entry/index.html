<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halcyon Entry Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a market-desk dossier. Sticky section index on the left, one reading column on the right; every number recalculates from the controls. */
:root {
  --bg: #EDF0F2;
  --surface: #FFFFFF;
  --ink: #0D1A26;
  --muted: #56646F;
  --line: #D3DADF;
  --accent: #0B7A63;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE8;
  --warn: #A86A12;
  --warn-soft: #F6EAD5;
  --hold: #9A4433;
  --hold-soft: #F3E1DC;
  --track: #E3E8EB;
  --f-display: "Archivo", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: clamp(2rem, 4.6vw, 3.25rem);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1117; --surface: #111B23; --ink: #E4EAEE; --muted: #93A2AC; --line: #22303A;
    --accent: #3DC3A1; --accent-ink: #05241C; --accent-soft: #123128;
    --warn: #E2AA4F; --warn-soft: #33270F; --hold: #E58B76; --hold-soft: #351C17; --track: #1C2932;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1117; --surface: #111B23; --ink: #E4EAEE; --muted: #93A2AC; --line: #22303A;
  --accent: #3DC3A1; --accent-ink: #05241C; --accent-soft: #123128;
  --warn: #E2AA4F; --warn-soft: #33270F; --hold: #E58B76; --hold-soft: #351C17; --track: #1C2932;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--step-0)/1.6 var(--f-body);
  word-break: keep-all; overflow-wrap: anywhere;
  padding-inline: 16px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label {
  font: 500 var(--step--1)/1.3 var(--f-mono);
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}

.wrap { max-width: 1120px; margin: 0 auto; }

/* Top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 12px; }
.brand { font: 800 1rem/1 var(--f-display); font-stretch: 118%; letter-spacing: 0.08em; }
.brand span { color: var(--muted); font-weight: 600; letter-spacing: 0.02em; font-stretch: 100%; }
.conf { color: var(--muted); font-size: var(--step--1); margin-left: auto; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 10px; font: 500 var(--step--1)/1.4 var(--f-mono); cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.sample {
  margin-top: 16px;
  border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--ink);
  border-radius: var(--radius); padding: 10px 14px; font-size: var(--step--1);
}

/* Hero */
.hero { display: grid; gap: 24px; padding-block: 40px 32px; }
.hero h1 { font: 800 var(--step-3)/1.08 var(--f-display); font-stretch: 112%; letter-spacing: -0.01em; max-width: 22ch; }
.hero .lede { color: var(--muted); max-width: 62ch; font-size: var(--step-1); line-height: 1.55; }
.route {
  display: grid; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px;
}
.route-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stop { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); }
.stop b { font: 800 1.25rem/1 var(--f-display); font-stretch: 120%; }
.stop small { font: 500 var(--step--1)/1 var(--f-mono); color: var(--muted); }
.arrow { color: var(--muted); font-family: var(--f-mono); }
.route-meta { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); font-size: var(--step--1); }
.route-meta b { color: var(--ink); font-weight: 600; }

/* Page grid */
.page { display: grid; gap: 32px; padding-bottom: 64px; }
.rail { display: none; }
@media (min-width: 960px) {
  .hero { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: end; }
  .page { grid-template-columns: 190px minmax(0, 1fr); gap: 48px; }
  .rail { display: block; }
  .rail nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 2px; }
  .rail a { display: grid; grid-template-columns: 1.6em 1fr; padding: 6px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: var(--step--1); }
  .rail a:hover { color: var(--ink); background: var(--surface); }
  .rail a span { font-family: var(--f-mono); }
}
main { display: grid; gap: 56px; min-width: 0; }
section { display: grid; gap: 16px; min-width: 0; scroll-margin-top: 80px; }
.sec-head { display: grid; gap: 6px; }
.sec-head h2 { font: 700 var(--step-2)/1.2 var(--f-display); font-stretch: 108%; }
.sec-head p { color: var(--muted); max-width: 66ch; }

/* Now */
.facts { display: grid; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding-block: 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.fact .v { font: 700 1.5rem/1 var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.fact .v.alert { color: var(--hold); }
.fact .note { grid-column: 1 / -1; color: var(--muted); font-size: var(--step--1); }
.read {
  border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; max-width: 66ch;
}
.read .label { display: block; margin-bottom: 4px; }

/* Markets */
.markets { display: grid; gap: 8px; }
.mkt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.mkt.on { border-color: var(--accent); }
.mkt-row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px 14px; align-items: center;
  padding: 12px 14px;
}
.mkt-code { font: 800 1.125rem/1 var(--f-display); font-stretch: 120%; }
.mkt-main { display: grid; gap: 6px; min-width: 0; }
.mkt-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.mkt-title strong { font-weight: 600; }
.chip { font: 500 0.75rem/1 var(--f-mono); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.chip.go { background: var(--accent-soft); color: var(--accent); }
.chip.prep { background: var(--warn-soft); color: var(--warn); }
.chip.hold { background: var(--hold-soft); color: var(--hold); }
.meter { display: grid; grid-template-columns: minmax(0, 1fr) 2.6em; gap: 10px; align-items: center; }
.meter-track { position: relative; height: 8px; background: var(--track); border-radius: 999px; }
.meter-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--muted); }
.mkt.on .meter-fill { background: var(--accent); }
.meter-mark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink); opacity: 0.5; }
.meter b { font: 600 var(--step-0)/1 var(--f-mono); text-align: right; }
.mkt-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; font-size: var(--step--1); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.more { padding-inline: 10px; font-family: var(--f-mono); }
.mkt-detail { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 16px; }
@media (min-width: 720px) { .mkt-detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); } }
.factors { display: grid; gap: 8px; }
.factor { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 2em; gap: 10px; align-items: center; font-size: var(--step--1); }
.factor .meter-track { height: 6px; }
.factor .meter-fill { background: var(--ink); opacity: 0.7; }
.detail-list { display: grid; gap: 10px; }
.detail-list ul { margin: 4px 0 0; padding-left: 1.1em; }
.detail-list li + li { margin-top: 2px; }
@media (max-width: 560px) {
  .mkt-row { grid-template-columns: 36px minmax(0, 1fr); }
  .mkt-actions { grid-column: 1 / -1; }
  .mkt-actions .toggle { flex: 1; }
}

/* Sequence */
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button small { color: var(--muted); font-size: 0.75rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: 0.75; }
.gantt-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.gantt { min-width: 600px; padding: 14px 16px 16px; display: grid; gap: 8px; }
.g-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; }
.g-name { font-size: var(--step--1); display: flex; gap: 6px; align-items: baseline; }
.g-name b { font: 700 var(--step-0)/1 var(--f-display); font-stretch: 115%; }
.g-track { position: relative; height: 22px; background: repeating-linear-gradient(to right, var(--track) 0 1px, transparent 1px calc(100% / 12)); border-radius: 4px; }
.g-seg { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; }
.g-seg.prep { background: var(--warn); opacity: 0.75; }
.g-seg.launch { background: var(--accent); }
.g-seg.grow { background: var(--accent); opacity: 0.28; }
.g-axis .g-track { background: none; height: auto; display: grid; grid-template-columns: repeat(12, 1fr); }
.g-axis .g-track span { font: 500 0.6875rem/1 var(--f-mono); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--step--1); color: var(--muted); padding: 0 16px 14px; }
.legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

/* Quote */
.quote { display: grid; gap: 16px; }
@media (min-width: 820px) { .quote { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); align-items: start; } }
.modules { display: grid; gap: 8px; }
.module {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer;
}
.module input { margin: 4px 0 0; accent-color: var(--accent); width: 16px; height: 16px; }
.module small { grid-column: 2; color: var(--muted); font-size: var(--step--1); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; min-width: 420px; }
th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: var(--step--1); }
th { font: 500 0.75rem/1.3 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
td.r, th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.na { color: var(--muted); }
tfoot td { font-weight: 600; border-bottom: 0; }
tfoot tr.grand td { font-size: var(--step-0); border-top: 2px solid var(--ink); }

/* Synergy */
.syn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
@media (min-width: 820px) { .syn { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.syn div { background: var(--surface); padding: 16px; display: grid; gap: 6px; align-content: start; }
.syn b { font: 700 1.75rem/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.syn span { font-size: var(--step--1); color: var(--muted); }

/* CTA */
.cta { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 24px; display: grid; gap: 16px; }
.cta h2 { font: 700 var(--step-2)/1.2 var(--f-display); font-stretch: 108%; }
.cta p { opacity: 0.8; max-width: 60ch; }
.cta pre {
  margin: 0; white-space: pre-wrap; word-break: break-word;
  background: color-mix(in srgb, var(--bg) 8%, transparent); border: 1px solid color-mix(in srgb, var(--bg) 20%, transparent);
  border-radius: 8px; padding: 14px; font: 400 var(--step--1)/1.6 var(--f-mono);
}
.cta-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.cta .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 11px 18px; font-weight: 600; cursor: pointer; }
.cta .addr { font-family: var(--f-mono); user-select: all; }
.cta .status { font-size: var(--step--1); opacity: 0.8; }
.empty { color: var(--muted); font-size: var(--step--1); padding: 12px 0; }

footer { border-top: 1px solid var(--line); padding-block: 20px 32px; color: var(--muted); font-size: var(--step--1); display: flex; flex-wrap: wrap; gap: 6px 20px; }

@media (prefers-reduced-motion: no-preference) {
  .meter-fill, .g-seg { transition: width 0.35s ease, left 0.35s ease; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand">PANASIA <span>Entry Map</span></div>
    <div class="conf" data-t="conf"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ko" data-lang="ko" aria-pressed="true">KO</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="sample" data-t="sample"></div>

  <div class="hero">
    <div style="display:grid;gap:16px">
      <div class="label" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="route" aria-live="polite">
      <div class="label" data-t="routeLabel"></div>
      <div class="route-line" id="route"></div>
      <div class="route-meta" id="route-meta"></div>
    </div>
  </div>

  <div class="page">
    <aside class="rail"><nav id="rail"></nav></aside>
    <main>
      <section id="now">
        <div class="sec-head"><h2 data-t="s1title"></h2><p data-t="s1lede"></p></div>
        <div class="facts" id="facts"></div>
        <div class="read"><span class="label" data-t="readLabel"></span><p data-t="read"></p></div>
      </section>

      <section id="markets">
        <div class="sec-head"><h2 data-t="s2title"></h2><p data-t="s2lede"></p></div>
        <div class="markets" id="market-list"></div>
      </section>

      <section id="sequence">
        <div class="sec-head"><h2 data-t="s3title"></h2><p data-t="s3lede"></p></div>
        <div class="controls">
          <div class="seg" role="group" id="pace">
            <button type="button" id="pace-seq" data-pace="seq" aria-pressed="true"><span data-t="paceSeq"></span><small data-t="paceSeqNote"></small></button>
            <button type="button" id="pace-par" data-pace="par" aria-pressed="false"><span data-t="pacePar"></span><small data-t="paceParNote"></small></button>
          </div>
        </div>
        <div class="gantt-wrap">
          <div class="gantt" id="gantt"></div>
          <div class="legend">
            <span><i style="background:var(--warn);opacity:.75"></i><span data-t="phPrep"></span></span>
            <span><i style="background:var(--accent)"></i><span data-t="phLaunch"></span></span>
            <span><i style="background:var(--accent);opacity:.28"></i><span data-t="phGrow"></span></span>
          </div>
        </div>
      </section>

      <section id="quote">
        <div class="sec-head"><h2 data-t="s4title"></h2><p data-t="s4lede"></p></div>
        <div class="quote">
          <div class="modules" id="modules"></div>
          <div class="table-wrap"><table id="quote-table"></table></div>
        </div>
      </section>

      <section id="synergy">
        <div class="sec-head"><h2 data-t="s5title"></h2><p data-t="s5lede"></p></div>
        <div class="syn" id="syn"></div>
      </section>

      <section id="next">
        <div class="cta">
          <h2 data-t="s6title"></h2>
          <p data-t="s6lede"></p>
          <pre id="summary"></pre>
          <div class="cta-row">
            <button type="button" class="primary" id="copy-btn" data-t="copy"></button>
            <span><span data-t="sendTo"></span> <span class="addr">people@panasia.io</span></span>
            <span class="status" id="copy-status" aria-live="polite"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer>
    <span>Panasia · Seoul</span>
    <span data-t="footerNote"></span>
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   BRIEF: the only part that changes per prospect.
   Copy this file, replace this object, send the link.
   All values below are SAMPLE data for a fictional project.
   ───────────────────────────────────────────────────────────── */

  ],
  read: {

  },

  // prep / launch in weeks; exch, partners, reach = what Panasia can open in that market
  markets: [

const W = { reg: 0.25, exch: 0.25, demand: 0.30, partners: 0.20 };
const GO = 75, PREP = 60, WEEKS = 52;
const state = {
  lang: "ko",
  selected: new Set(["KR", "SG", "JP"]),
  pace: "seq",
  modules: new Set(["strategy", "listing", "community", "partnerships"]),
  open: "KR"
};
try { const saved = localStorage.getItem("entrymap-lang"); if (saved === "ko" || saved === "en") state.lang = saved; } catch (e) {}

const $ = (s) => document.querySelector(s);
const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
const score = (m) => Math.round(m.f.reg * W.reg + m.f.exch * W.exch + m.f.demand * W.demand + m.f.partners * W.partners);
const status = (s) => (s >= GO ? "go" : s >= PREP ? "prep" : "hold");
const byScore = BRIEF.markets.slice().sort((a, b) => score(b) - score(a));
const inScope = () => byScore.filter((m) => state.selected.has(m.code));
const compact = (n) => (n >= 1000 ? (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "k" : String(n));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function schedule(list) {
  let cursor = 0;
  return list.map((m, i) => {
    const start = state.pace === "seq" ? cursor : i * 2;
    cursor = start + m.prep + m.launch;
    return { m, start, prepEnd: start + m.prep, launchEnd: start + m.prep + m.launch };
  });
}

function quote(list) {
  const rows = [];
  let once = 0, monthly = 0;
  BRIEF.modules.forEach((mod) => {
    if (!state.modules.has(mod.id)) return;
    const eligible = mod.needsExchange ? list.filter((m) => m.exch > 0) : list;
    const n = eligible.length;
    const o = n ? mod.once + mod.oncePerMarket * n : 0;
    const mo = mod.monthlyPerMarket * n;
    once += o; monthly += mo;
    rows.push({ mod, n, once: o, monthly: mo });
  });
  return { rows, once, monthly, total: once + monthly * BRIEF.months };
}

function renderStatic() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = t[el.dataset.t];
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  const ids = ["now", "markets", "sequence", "quote", "synergy", "next"];
  $("#rail").innerHTML = ids.map((id, i) => '<a href="#' + id + '"><span>' + (i + 1) + "</span>" + esc(t.nav[i]) + "</a>").join("");
  $("#facts").innerHTML = BRIEF.facts.map((f) => {
    const [k, note] = f[state.lang];
    return '<div class="fact"><span>' + esc(k) + '</span><span class="v' + (f.alert ? " alert" : "") + '">' + esc(f.v) + '</span><span class="note">' + esc(note) + "</span></div>";
  }).join("");
  $('[data-t="read"]').textContent = BRIEF.read[state.lang];
}

  const t = T[state.lang];
  $("#market-list").innerHTML = byScore.map((m) => {
    const s = score(m), st = status(s), on = state.selected.has(m.code), open = state.open === m.code;
    const L = m[state.lang];
    const factors = Object.keys(W).map((k) =>
      '<div class="factor"><span>' + esc(t.factors[k]) + '</span><div class="meter-track"><div class="meter-fill" style="width:' + m.f[k] + '%"></div></div><span class="num">' + m.f[k] + "</span></div>"
    ).join("");
    return '<div class="mkt' + (on ? " on" : "") + '">' +
      '<div class="mkt-row">' +
        '<div class="mkt-code">' + m.code + "</div>" +
        '<div class="mkt-main">' +

        "</div>" +

function renderSequence(list) {
  const t = T[state.lang];
  document.querySelectorAll("#pace button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pace === state.pace)));
  if (!list.length) { $("#gantt").innerHTML = '<p class="empty">' + esc(t.empty) + "</p>"; return; }
  const pct = (w) => (Math.min(w, WEEKS) / WEEKS) * 100;
  const seg = (cls, a, b) => (a >= WEEKS ? "" : '<div class="g-seg ' + cls + '" style="left:' + pct(a) + "%;width:" + (pct(b) - pct(a)) + '%"></div>');
  const axis = '<div class="g-row g-axis"><span></span><div class="g-track">' + Array.from({ length: 12 }, (_, i) => "<span>M" + (i + 1) + "</span>").join("") + "</div></div>";
  $("#gantt").innerHTML = axis + schedule(list).map((r) =>
    '<div class="g-row"><div class="g-name"><b>' + r.m.code + "</b>" + esc(r.m[state.lang].name) + '</div><div class="g-track">' +
      seg("prep", r.start, r.prepEnd) + seg("launch", r.prepEnd, r.launchEnd) + seg("grow", r.launchEnd, WEEKS) +
    "</div></div>"
  ).join("");
}

function renderQuote(list, q) {
  const t = T[state.lang];
  $("#modules").innerHTML = BRIEF.modules.map((mod) => {
    const [name, note] = mod[state.lang];
    return '<label class="module" for="mod-' + mod.id + '"><input type="checkbox" id="mod-' + mod.id + '" data-mod="' + mod.id + '"' + (state.modules.has(mod.id) ? " checked" : "") + "><span>" + esc(name) + "</span><small>" + esc(note) + "</small></label>";
  }).join("");
  const body = q.rows.map((r) =>
    "<tr><td>" + esc(r.mod[state.lang][0]) + '<br><span style="color:var(--muted)">' + esc(r.n ? t.perMarket(r.n) : t.na) + "</span></td>" +
    '<td class="r' + (r.n ? "" : " na") + '">' + (r.once ? usd(r.once) : "–") + "</td>" +
    '<td class="r' + (r.n ? "" : " na") + '">' + (r.monthly ? usd(r.monthly) : "–") + "</td></tr>"
  ).join("");
  $("#quote-table").innerHTML =
    '<thead><tr><th>' + esc(t.colItem) + '</th><th class="r">' + esc(t.colOnce) + '</th><th class="r">' + esc(t.colMonthly) + "</th></tr></thead>" +
    "<tbody>" + (body || '<tr><td colspan="3" class="na">' + esc(t.empty) + "</td></tr>") + "</tbody>" +
    "<tfoot><tr><td>" + esc(t.subtotal) + '</td><td class="r">' + usd(q.once) + '</td><td class="r">' + usd(q.monthly) + "</td></tr>" +
    '<tr class="grand"><td>' + esc(t.grand) + '</td><td class="r" colspan="2">' + usd(q.total) + "</td></tr></tfoot>";
}

function firstFiatWeeks(list) {
  const r = schedule(list).find((x) => x.m.exch > 0);
  return r ? r.launchEnd : null;
}

function renderSynergy(list) {
  const t = T[state.lang];
  const sum = (k) => list.reduce((a, m) => a + m[k], 0);
  const ff = firstFiatWeeks(list);
  const cells = [
    [String(sum("exch")), t.syn.exch],
    [String(sum("partners")), t.syn.partners],
    [compact(sum("reach")), t.syn.reach],
    [ff === null ? t.noFiat : t.weeks(ff), t.syn.first]
  ];
  $("#syn").innerHTML = cells.map((c) => "<div><b>" + esc(c[0]) + "</b><span>" + esc(c[1]) + "</span></div>").join("");
}

function renderRoute(list, q) {
  const t = T[state.lang];
  if (!list.length) { $("#route").innerHTML = '<p class="empty">' + esc(t.empty) + "</p>"; $("#route-meta").innerHTML = ""; return; }
  $("#route").innerHTML = list.map((m, i) =>
    (i ? '<span class="arrow" aria-hidden="true">→</span>' : "") +
    '<span class="stop"><b>' + m.code + "</b><small>" + esc(m[state.lang].name) + " " + score(m) + "</small></span>"
  ).join("");
  const firstLaunch = schedule(list)[0].launchEnd;
  $("#route-meta").innerHTML = t.routeMeta(list.length, firstLaunch, usd(q.total)).map((x) => "<span>" + x + "</span>").join("");
}

function renderSummary(list, q) {
  const t = T[state.lang];
  if (!list.length) { $("#summary").textContent = t.empty; return; }
  $("#summary").textContent = t.summary({
    route: list.map((m) => m[state.lang].name).join(" → "),
    pace: state.pace === "seq" ? t.paceSeq : t.pacePar,
    modules: BRIEF.modules.filter((m) => state.modules.has(m.id)).map((m) => m[state.lang][0]).join(", ") || "–",
    once: usd(q.once), monthly: usd(q.monthly), total: usd(q.total),
    exch: list.reduce((a, m) => a + m.exch, 0),
    partners: list.reduce((a, m) => a + m.partners, 0)
  });
}

function render() {
  const list = inScope();
  const q = quote(list);
  renderMarkets();
  renderSequence(list);
  renderQuote(list, q);
  renderSynergy(list);
  renderRoute(list, q);
  renderSummary(list, q);
  $("#copy-status").textContent = "";
}

document.addEventListener("click", (e) => {
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const c = tg.dataset.toggle; state.selected.has(c) ? state.selected.delete(c) : state.selected.add(c); render(); document.getElementById("tg-" + c)?.focus(); return; }
  const op = e.target.closest("[data-open]");
  if (op) { const c = op.dataset.open; state.open = state.open === c ? null : c; render(); document.getElementById("mo-" + c)?.focus(); return; }
  const pc = e.target.closest("[data-pace]");
  if (pc) { state.pace = pc.dataset.pace; render(); return; }
  const lg = e.target.closest("[data-lang]");
  if (lg) {
    state.lang = lg.dataset.lang;
    try { localStorage.setItem("entrymap-lang", state.lang); } catch (err) {}
    renderStatic(); render(); return;
  }
});
document.addEventListener("change", (e) => {
  const id = e.target.dataset && e.target.dataset.mod;
  if (!id) return;
  e.target.checked ? state.modules.add(id) : state.modules.delete(id);
  render();
  document.getElementById("mod-" + id)?.focus();
});
$("#copy-btn").addEventListener("click", () => {
  const t = T[state.lang];
  const text = $("#summary").textContent;
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("#summary"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    $("#copy-status").textContent = t.copyFail;
  };
  try {
    navigator.clipboard.writeText(text).then(() => { $("#copy-status").textContent = t.copied; }, fallback);
  } catch (err) { fallback(); }
});

renderStatic();
render();
</script>
</body>
</html>
