<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panasia Scope Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an institutional dossier on cool paper. A reading column (7/12) carries the six numbered sections; a sticky Scope Draft sheet (5/12) grows line by line like a term sheet being drafted. Below 1024px the sheet folds into a bottom bar + dialog. */
:root{
  --paper:#F3F4F2; --surface:#FBFBFA; --sunk:#E8EAE6; --ink:#14171C; --muted:#535962; --rule:#D3D6D1; --rule-strong:#7D847E;
  --accent:#243A7C; --accent-soft:#E1E6F3; --on-accent:#FFFFFF;
  --proof:#1C6449; --proof-soft:#DBEBE2; --check:#845400; --check-soft:#F3EAD5;
  --closed:#9A2E26; --closed-soft:#F3E0DC; --hatch:rgba(20,23,28,.5);
  --f-display:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang","Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --radius:4px; --shadow:0 1px 0 var(--rule);
  --step--2:.75rem; --step--1:.8125rem; --step-0:.9375rem; --step-1:1.125rem; --step-2:1.5rem; --step-3:clamp(1.9rem,4.4vw,3.1rem);
  --hatch-bg:repeating-linear-gradient(45deg,var(--hatch) 0 1.5px,transparent 1.5px 7px);
  --head-h:58px; --bar-h:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E1116; --surface:#141920; --sunk:#0A0D11; --ink:#E7E9EC; --muted:#9BA2AC; --rule:#262D37; --rule-strong:#687180;
  --accent:#A9B5FF; --accent-soft:#1C2242; --on-accent:#0E1116;
  --proof:#62C89D; --proof-soft:#11271E; --check:#E3B262; --check-soft:#2C2312;
  --closed:#EF9084; --closed-soft:#321917; --hatch:rgba(231,233,236,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0E1116; --surface:#141920; --sunk:#0A0D11; --ink:#E7E9EC; --muted:#9BA2AC; --rule:#262D37; --rule-strong:#687180;
  --accent:#A9B5FF; --accent-soft:#1C2242; --on-accent:#0E1116;
  --proof:#62C89D; --proof-soft:#11271E; --check:#E3B262; --check-soft:#2C2312;
  --closed:#EF9084; --closed-soft:#321917; --hatch:rgba(231,233,236,.4); color-scheme:dark; }

/* ── base ── */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--head-h) + 16px);scroll-padding-bottom:96px;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--step-0);line-height:1.62;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.28;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:var(--step-2)} h3{font-size:var(--step-1)} h4{font-size:var(--step-0);font-family:var(--f-body);font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:var(--step--1)}
.tiny{font-size:var(--step--2)}
.caps{font-family:var(--f-mono);font-size:var(--step--2);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:grid;gap:12px}
.stack-lg{display:grid;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hr{border:0;border-top:1px solid var(--rule);margin:0}
html[lang="ko"] .caps,html[lang="ko"] .eyebrow,html[lang="ko"] .sl .k,html[lang="ko"] .chip,html[lang="ko"] .tag,html[lang="ko"] .lh .t{letter-spacing:.01em}
/* Plex Mono has no Hangul: Hangul falls back to Plex Sans KR while spaces stay 0.6em mono, so pull the word gaps back to Korean rhythm (Latin-only labels such as "SCOPE DRAFT" are excluded) */
html[lang="ko"] :is(.caps,.eyebrow,.tag,.chip,.vtag,.kv dt,.sl .k,.rung .r,.stamp .lab,.stamp .meta,.metric.pending .who,.banner summary,.ribbon,.own,.toggle,.g-lab,.mslist,.tbl thead th){word-spacing:-.32em}
html[lang="ko"] .caps,html[lang="ko"] .eyebrow{text-transform:none}
.skip{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;top:8px;left:16px;z-index:80}
.skip:focus{width:auto;height:auto;overflow:visible;clip:auto;background:var(--surface);color:var(--ink);padding:10px 14px;border:1px solid var(--ink);border-radius:var(--radius)}
.nowrap{white-space:nowrap}

/* ── header ── */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--rule)}
.ribbon{background:var(--hatch-bg),var(--check-soft);color:var(--check);font-family:var(--f-mono);font-size:var(--step--2);letter-spacing:.08em;text-align:center;padding:4px 16px;border-bottom:1px solid var(--rule)}
.ribbon span{background:var(--check-soft);padding:1px 8px}
.hdr-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:0;white-space:nowrap;min-height:44px;align-items:center}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.06rem;letter-spacing:.02em}
.brand .sub{color:var(--muted);font-size:var(--step--1);white-space:pre}
.brand .lat{font-family:var(--f-mono);font-size:var(--step--2);letter-spacing:.16em;margin-left:6px;color:var(--ink)}
@media (max-width:599px){ .brand .id-long{display:none} }
@media (min-width:720px){ body:not(.cover-only):not(.review-mode) .brand .id-long{display:none} }
@media (min-width:720px) and (max-width:1399px){ body:not(.cover-only) .th-seg{display:none} body:not(.cover-only) .th-cyc{display:inline-flex} }
@media (max-width:419px){ .brand{display:grid;grid-template-columns:auto auto;justify-content:start;align-content:center;line-height:1.15} .brand .sub{grid-column:1/-1;font-size:var(--step--2);white-space:nowrap} .brand .sub .sep{display:none} .brand .lat{display:inline;align-self:center} }
.idx{flex:1 1 300px;min-width:0;display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:24px;scrollbar-width:none;padding:4px 2px}
.idx.more{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.idx.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 100%);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 100%)}
.idx.more.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 86%,transparent)}
body.cover-only .idx{visibility:hidden}
.idx::-webkit-scrollbar{display:none}
.idx button{scroll-snap-align:start;flex:0 0 auto;min-height:36px;padding:4px 10px;border:1px solid transparent;border-radius:var(--radius);font-size:var(--step--1);color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.idx button .mono{font-size:var(--step--2)}
.idx button[aria-current="true"]{color:var(--ink);border-color:var(--rule)}
.idx button:disabled{opacity:.45;cursor:default}
.idx .tick{display:inline-block;width:13px;height:13px;border:1px solid var(--rule-strong);border-radius:50%;font-size:10px;line-height:11px;text-align:center}
.seg button:focus-visible,.idx button:focus-visible{outline-offset:-3px}
.idx .tick.on{background:var(--proof);border-color:var(--proof);color:var(--paper)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{min-height:34px;min-width:40px;padding:2px 10px;font-size:var(--step--1);color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"]:focus-visible{outline-color:var(--paper);outline-offset:-4px}
.xbtn{min-height:34px;padding:2px 10px;border:1px solid var(--rule);border-radius:var(--radius);font-size:var(--step--1);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.xbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.xbtn kbd{font-family:var(--f-mono);font-size:var(--step--2);border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--muted)}
.xbtn .short,.th-cyc{display:none}
@media (max-width:719px){ .hdr-in{gap:4px 8px;padding-block:6px} .brand{min-height:40px} .tools{margin-left:auto} .idx{order:3;flex-basis:100%} body.cover-only .idx{display:none} .xbtn kbd,.xbtn .long,.th-seg{display:none} .xbtn .short,.th-cyc{display:inline-flex} }
@media (max-width:1023px){ input[type=text],select,textarea{font-size:16px!important} }

/* ── operator banner ── */
.banner{max-width:1180px;margin:12px auto 0;padding-inline:16px}
.banner details{border:1px dashed var(--check);border-radius:var(--radius);background:var(--check-soft);color:var(--ink);font-size:var(--step--1)}
.banner summary{cursor:pointer;padding:10px 14px;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--check);font-family:var(--f-mono);font-size:var(--step--1)}
.banner .bd{padding:0 14px 14px;display:grid;gap:10px}
.banner li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:4px 0;border-top:1px solid var(--rule)}
.lvl{font-family:var(--f-mono);font-size:var(--step--2);padding:1px 5px;border-radius:2px;border:1px solid currentColor;height:fit-content}
.lvl.block{color:var(--closed)} .lvl.warn{color:var(--check)}

/* ── layout ── */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.layout{display:block}
main{min-width:0}
@media (min-width:1024px){
  .wrap{padding-inline:24px}
  .layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:start}
  .sheet-wrap{position:sticky;top:calc(var(--head-h) + 20px);max-height:calc(100vh - var(--head-h) - 40px);overflow:auto;margin-top:40px}
  .bar{display:none!important}
}
body.cover-only .layout,body.review-mode .layout{display:block}
body.review-mode .review{max-width:900px;margin-inline:auto}
body.cover-only .sheet-wrap{display:none}
@media (min-width:900px){ body.cover-only .doors{grid-template-columns:repeat(3,minmax(0,1fr))} body.cover-only .door{border-top:0;border-left:1px solid var(--rule);padding:16px 18px;grid-template-columns:40px 1fr} body.cover-only .door:first-child{border-left:0;padding-left:4px} body.cover-only .door{grid-template-rows:auto 1fr auto} body.cover-only .door .s{grid-column:2;grid-row:2} body.cover-only .door .go{grid-column:2;grid-row:3;justify-self:start;align-self:end;margin-top:8px} body.cover-only .lede{max-width:40em} body.cover-only .cover h1{max-width:19em} html[lang="en"] body.cover-only .cover h1{max-width:24em} body.cover-only #s0.sec{padding-top:12px} }
.door:hover .go,.door:focus-visible .go{text-decoration:underline;text-underline-offset:3px}
/* cover preview of the Scope Draft (wide screens): ruled blanks only, nothing invented */
.cover-ghost{display:none}
@media (min-width:1200px){
  body.cover-only .cover{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:56px;align-items:start}
  body.cover-only .cover>*{grid-column:1/-1}
  body.cover-only .cover>.eyebrow,body.cover-only .cover>h1,body.cover-only .cover>.lede,body.cover-only .cover>.tagline{grid-column:1}
  body.cover-only .cover-ghost{display:block;grid-column:2;grid-row:1/span 4;align-self:start;margin-top:4px}
}
.ghost-sheet{padding:16px 20px 14px;box-shadow:none}
.ghost-sheet .sl{padding:6px 0;grid-template-columns:72px minmax(0,1fr)}
.ghost-sheet .blank{display:block;height:1.05em;border-bottom:1px dashed var(--rule-strong)}
.ghost-sheet .sl:nth-child(odd) .blank{width:72%} .ghost-sheet .sl:nth-child(3n) .blank{width:54%}
.ghost-sheet .cap{margin-top:10px;font-size:var(--step--2);color:var(--muted)}
@media (min-width:1000px){ body.cover-only .strip{grid-template-columns:repeat(6,minmax(0,1fr))} }
@media (max-width:1023px){ .sheet-wrap{display:none} body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))} }

/* ── sections ── */
.sec{padding-block:44px 52px;border-top:1px solid var(--rule)}
.sec:first-child{border-top:0}
.sec-h{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;margin-bottom:22px}
.sec-h .no{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted)}
.sec-h .sub{grid-column:2;color:var(--muted);font-size:var(--step--1)}
.block{margin-top:28px}
.block>h3,.block>.bh{margin-bottom:12px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:18px}
.panel.sunk{background:var(--sunk);border-color:transparent}
.note{font-size:var(--step--1);color:var(--muted)}
.lock-note{display:flex;gap:8px;align-items:flex-start;font-size:var(--step--1);color:var(--muted)}
details.dis>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;font-size:var(--step--1);border-top:1px solid var(--rule);padding-block:10px}
details.dis>summary::-webkit-details-marker{display:none}
details.dis>summary::before{content:"+";content:"+" / "";font-family:var(--f-mono);width:18px;height:18px;border:1px solid var(--rule-strong);border-radius:2px;display:inline-grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
details.dis[open]>summary::before{content:"−";content:"−" / ""}
.block>h2.h3{margin-bottom:12px}
details.dis>.dbody{padding:6px 0 18px}

/* ── §0 cover ── */
.cover{padding-block:16px 36px}
@media (max-width:719px){ .sec{padding-block:32px 40px} }
.eyebrow{font-family:var(--f-mono);font-size:var(--step--2);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.cover h1{font-size:clamp(1.85rem,3.6vw,2.75rem);margin-top:10px;max-width:none;font-weight:700;line-height:1.25}
.lede{margin-top:12px;font-size:var(--step-1);line-height:1.6;max-width:36em}
.tagline{margin-top:12px;color:var(--ink);font-size:var(--step-0);max-width:40em}
.tagline.m,.strip-note-m{display:none}
.doors-q{margin-top:24px}
@media (max-width:599px){ .door{grid-template-columns:30px 1fr auto;gap:2px 10px} .door .go{font-size:var(--step--2)} #s0.sec{padding-top:12px} .cover{padding-top:4px} .cover h1{font-size:1.6rem;margin-top:10px} .lede{font-size:var(--step-0);margin-top:10px} body.cover-only .cover>.tagline{display:none} body.cover-only .cover>.tagline.m{display:block;margin-top:14px} .door{padding-block:12px} .doors-q{margin-top:16px} .strip-h .note{display:none} .strip-note-m{display:block;margin-top:8px} }
.doors{margin-top:8px;display:grid;grid-template-columns:1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.door{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:start;text-align:left;padding:18px 4px;border-top:1px solid var(--rule);min-height:44px;transition:background .15s}
.door:first-child{border-top:0}
.door:hover,.door:focus-visible{background:var(--surface);box-shadow:inset 0 3px 0 var(--accent)}
.door .k{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);padding-top:3px}
.door .t{font-family:var(--f-display);font-weight:700;font-size:var(--step-1);line-height:1.35}
.door .s{grid-column:2;color:var(--muted);font-size:var(--step--1)}
.door .go{font-family:var(--f-mono);font-size:var(--step--1);color:var(--accent);align-self:center;white-space:nowrap}
.door[aria-current="true"]{background:var(--accent-soft)}
.door[aria-current="true"] .k{color:var(--accent)}
.quiet{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:var(--step--1)}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.paste{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.paste input{font-family:var(--f-mono);font-size:var(--step--1);min-height:40px;width:min(100%,250px);padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface)}
.paste-dis>summary{list-style:none;cursor:pointer}
.paste-dis>summary::-webkit-details-marker{display:none}
.paste-dis[open]>summary{margin-bottom:4px}
.notice{margin-top:14px;padding:10px 14px;border-left:3px solid var(--closed);background:var(--closed-soft);font-size:var(--step--1)}
.notice.ok{border-color:var(--proof);background:var(--proof-soft)}
.strip-h{margin-top:24px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.strip{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--rule)}
@media (min-width:640px){ .strip{grid-template-columns:repeat(3,minmax(0,1fr))} }
.metric{text-align:left;padding:14px 12px 14px 0;border-bottom:1px solid var(--rule);display:grid;gap:4px;align-content:start;min-height:44px}
.metric .fig{font-family:var(--f-mono);font-size:clamp(1.5rem,3.4vw,2rem);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.metric .lb{font-size:var(--step--1);line-height:1.45}
.metric .who{font-family:var(--f-display);font-weight:700;font-size:var(--step--1);color:var(--ink);letter-spacing:0}
.metric.pending .who{font-family:var(--f-mono);font-weight:400;font-size:var(--step--2);color:var(--muted)}
.metric .mq{font-size:var(--step--2);font-style:italic;color:var(--muted);line-height:1.4}
.metric .mq.orig{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:0}
.metric .fig .pv-r::before{width:.28em;height:.28em}
.metric.pending .fig{text-decoration:underline dotted var(--muted);text-underline-offset:6px}
.metric[aria-expanded="true"] .fig{color:var(--accent)}
.drawer{margin-top:12px;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:var(--step--1)}
.legend{margin-top:12px;display:grid;grid-template-columns:1fr;gap:8px 32px;font-size:var(--step--1)}
@media (min-width:900px){ .legend{grid-template-columns:1fr 1fr} }
.legend li{display:grid;grid-template-columns:10.5rem minmax(0,1fr);gap:4px 14px;align-items:baseline}
footer .legend{grid-template-columns:1fr}
.legend li>span:first-child{white-space:nowrap}
.legend-dis{margin-top:20px}
.legend .d{color:var(--muted)}

/* stamp + prospect cover */
.stamp{border:4px double var(--accent);padding:18px 20px;background:var(--surface);display:grid;gap:6px;margin-top:6px}
.stamp .lab{font-family:var(--f-mono);font-size:var(--step--2);letter-spacing:.14em;color:var(--accent);font-variant:small-caps}
.stamp .co{font-family:var(--f-display);font-weight:700;font-size:var(--step-3);line-height:1.15}
.stamp .meta{font-family:var(--f-mono);font-size:var(--step--1);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.read{font-family:var(--f-display);font-size:var(--step-1);line-height:1.7;font-weight:500}
.facts{display:grid;gap:0;border-top:1px solid var(--rule)}
.fact{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.fact .v{font-family:var(--f-mono);font-size:var(--step-2);line-height:1.1;overflow-wrap:normal;white-space:nowrap}
.fact .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fact input{min-height:40px;flex:1 1 220px;padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);font-size:var(--step--1)}
@media (min-width:720px){ .fact{grid-template-columns:minmax(120px,max-content) minmax(0,1fr) auto;align-items:center} .fact .ctl{grid-column:3;grid-row:1} .fact.has-note .ctl{grid-column:1/-1;grid-row:auto} }
.sum2{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));border-top:1px solid var(--ink)}
.sum2>div{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.sum2 .caps{line-height:1.35}
.sum2 .n{font-family:var(--f-mono);font-size:var(--step-2);line-height:1.2}
.sum2 .n.txt{font-family:var(--f-display);font-size:var(--step-1);font-weight:700;line-height:1.3}

/* ── option chips (radiogroups) ── */
.q{display:grid;gap:8px;padding-block:14px;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.q .ql{display:flex;gap:10px;align-items:baseline;font-weight:500;font-size:var(--step--1)}
.q .ql .mono{color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:44px;padding:6px 14px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);font-size:var(--step--1);text-align:left;display:inline-flex;align-items:center;gap:8px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--rule-strong)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-checked="true"]::before,.opt[aria-pressed="true"]::before{content:"";width:6px;height:6px;background:currentColor;border-radius:1px}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt.sm{min-height:36px;padding:4px 10px}
.btn{min-height:44px;padding:8px 16px;border:1px solid var(--ink);border-radius:var(--radius);background:var(--surface);font-size:var(--step--1);font-weight:500;display:inline-flex;align-items:center;gap:8px;text-align:left}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{opacity:.9}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:var(--rule-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 12px}
select.sel{min-height:44px;padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);font-size:var(--step--1);max-width:min(100%,320px)}
.field{display:grid;gap:6px;font-size:var(--step--1);align-content:start}
.field input[type=text]{min-height:44px;width:100%;min-width:0;padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface)}
.panel .row>.field:last-child{flex:1 1 220px;min-width:0}
.counter{margin-top:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);font-size:var(--step--1);line-height:1.9}
@media (max-width:1023px){ #s1 .counter{position:sticky;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:6;line-height:1.6;padding:8px 12px;box-shadow:0 -10px 16px -14px rgba(20,23,28,.35)} html{scroll-padding-bottom:168px} }
.counter b{font-family:var(--f-mono);font-weight:500;font-size:var(--step-1);padding-inline:2px}
.pos{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.pos .sent{font-family:var(--f-display);font-size:var(--step-1);line-height:1.6;font-weight:500}
.nums{counter-reset:n;display:grid;gap:8px}
.nums li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:var(--step--1)}
.nums .tag,.ag .tag,.bh .vtag{white-space:normal}
.nums li::before{content:counter(n);font-family:var(--f-mono);color:var(--muted)}
.gate-msg{margin-top:20px;padding:14px;border:1px dashed var(--rule-strong);border-radius:var(--radius);color:var(--muted);font-size:var(--step--1)}

/* ── provenance marks ── */
.pv{position:relative}
.pv-r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pv-r::before{content:"";display:inline-block;width:.42em;height:.42em;background:currentColor;margin-right:.32em;vertical-align:.14em}
.pv-p{border:1px solid currentColor;border-radius:999px;padding:0 .45em}
.pv-p::after{content:" ↗";content:" ↗" / "";font-size:.85em}
.pv-v{text-decoration:underline dashed var(--muted);text-decoration-thickness:1px;text-underline-offset:4px}
.pv-v .vt{font-family:var(--f-mono);font-size:max(.7em,10px);vertical-align:super;color:var(--muted);margin-left:.2em;text-decoration:none;display:inline-block;letter-spacing:.04em;white-space:nowrap}
.pv-y{outline:1px solid var(--accent);outline-offset:1px;border-radius:2px;padding:0 .2em;color:var(--accent)}
.pv-s{background:var(--hatch-bg) 0 100%/100% .34em no-repeat;padding:0 .2em .18em;border-radius:1px;white-space:nowrap}
.tbl .pv-s{white-space:normal}
.h1c{display:inline-block}
.pv-s::after{content:attr(data-tag);font-family:var(--f-mono);font-size:max(.6em,10px);vertical-align:super;margin-left:.25em;color:var(--check);letter-spacing:.05em;white-space:nowrap}
.xt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;font-family:var(--f-mono);font-size:min(.68em,11px);color:var(--muted);margin-left:.3em;letter-spacing:.02em;font-weight:400;font-style:normal;line-height:1.3}
html.xray .xt{position:static;width:auto;height:auto;overflow:visible;clip:auto;display:inline}
html.xray .case .fig .xt,html.xray .metric .fig .xt,html.xray .sum2 .n .xt,html.xray .stamp .co .xt{display:inline-block;vertical-align:middle;letter-spacing:.02em}

html.xray .pv-s::after{display:none}
html.xray .pv-r{background:var(--proof-soft)}
html.xray .pv-p{background:var(--sunk)}
html.xray .pv-v{background:var(--check-soft)}
html.xray .pv-y{background:var(--accent-soft)}
html.xray .vblock{background:var(--check-soft)}
.vblock{position:relative;border-left:2px dashed var(--rule-strong);padding-left:12px}
.vtag{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted);border:1px dashed var(--rule-strong);border-radius:2px;padding:0 5px;letter-spacing:.05em;white-space:nowrap}
.sampleband{position:relative;border-left:0;padding-left:16px;background:linear-gradient(var(--paper),var(--paper)) padding-box}
.sampleband::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:8px;background:var(--hatch-bg);border:1px solid var(--rule-strong)}
.sampleband::after{content:attr(data-tag);font-family:var(--f-mono);font-size:var(--step--2);color:var(--check);margin-left:6px;letter-spacing:.06em;vertical-align:super}
.sampleblock{background:var(--hatch-bg) 0 0/100% 10px no-repeat,var(--surface);border:1px solid var(--rule);position:relative;padding-top:24px}
.stamp.sampleblock{border:4px double var(--accent);padding-top:28px}
.sampleblock::after{content:attr(data-tag);position:absolute;top:0;right:0;font-family:var(--f-mono);font-size:var(--step--2);background:var(--check-soft);color:var(--check);padding:1px 6px;letter-spacing:.06em}
.mk{display:inline-block;width:16px;text-align:center}

/* ── ledger cards ── */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.case .row{min-width:0}
@media (min-width:720px){ .cards.c2.loose{grid-template-columns:repeat(2,minmax(0,1fr))} }
.case{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px 22px;align-content:start}
.case .cl,.case .cr{display:grid;gap:8px;align-content:start;min-width:0}
@media (min-width:560px){ .case{grid-template-columns:minmax(130px,28%) minmax(0,1fr)} }
.case.pending{border-style:dotted;border-width:2px}
.case .fig{font-family:var(--f-mono);font-size:2.25rem;line-height:1;letter-spacing:-.03em;font-weight:500}
.case .fig.none{font-size:var(--step-0);letter-spacing:0;color:var(--muted);font-family:var(--f-body)}
.case .lb{font-size:var(--step--1);line-height:1.5}
.case .qual{font-size:var(--step--1);font-style:italic;line-height:1.5}
.case .orig{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted);font-style:normal}
.case .who{font-family:var(--f-display);font-weight:700}
.case .fig.pv-r::before,.case .fig .pv-r::before{width:9px;height:9px;vertical-align:.45em;margin-right:8px}
.why-line{font-size:var(--step--2);color:var(--accent);line-height:1.5}
.why-line .caps{color:var(--accent);margin-right:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:var(--step--2);color:var(--muted)}

.kv dd{margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:var(--step--2);border:1px solid var(--rule-strong);border-radius:2px;padding:1px 6px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.src{border-style:solid;border-radius:999px;white-space:normal;overflow:visible;text-overflow:clip}
.chip.on{border-color:var(--accent);color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:var(--step--2);padding:1px 6px;border-radius:2px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.tag.closed{background:var(--closed-soft);color:var(--closed)}
.tag.check{background:var(--check-soft);color:var(--check)}
.tag.clear{background:var(--proof-soft);color:var(--proof)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.line{border:1px solid var(--rule-strong);color:var(--muted)}
.case{position:relative}
.case .meta{font-family:var(--f-body);font-size:var(--step--2);color:var(--muted);line-height:1.5;letter-spacing:0}
.case .inst-side{border-top:1px dashed var(--rule);padding-top:8px}
@media (min-width:900px){ body.cover-only #s2 .cards{grid-template-columns:repeat(2,minmax(0,1fr))} body.cover-only #s2 .case{grid-template-columns:minmax(0,1fr)} }
.pinbtn{justify-self:start;min-height:40px;padding:4px 8px;margin-left:-8px;color:var(--accent);border:1px solid transparent;border-radius:var(--radius);font-size:var(--step--2);display:inline-flex;gap:6px;align-items:center}
.pinbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* coverage strip */
.cov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (min-width:720px){ .cov{grid-template-columns:repeat(8,minmax(0,1fr))} }
.tile{border:1px solid var(--rule);border-radius:var(--radius);padding:8px 8px;display:grid;gap:0;font-size:var(--step--2);align-content:start;background:var(--surface)}
.tile .c{font-family:var(--f-mono);font-size:var(--step-0);font-weight:500;color:var(--ink)}
.tile.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.solid .c,.tile.solid .muted{color:var(--paper)}
.tile.hatched{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--hatch-bg) border-box;border-top:6px solid transparent;color:var(--muted)}

/* target axis */
.axis svg{width:100%;height:auto;display:block;overflow:visible}
.zone{display:inline-flex;gap:8px;align-items:center;font-size:var(--step--1);font-weight:500;padding:6px 10px;border-radius:var(--radius)}
.zone.within{background:var(--proof-soft);color:var(--proof)}
.zone.stretch{background:var(--check-soft);color:var(--check)}
.zone.beyond{background:var(--closed-soft);color:var(--closed)}
.zone.none{background:var(--sunk);color:var(--muted)}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);min-height:44px}
#tgt{display:block;width:91.25%;margin-inline:auto}
@media (max-width:599px){ #tgt{width:87.3%} }

/* ── map ── */
.mapbox{background:radial-gradient(circle,var(--rule) 1px,transparent 1.4px) 0 0/14px 14px,var(--surface);border:1px solid var(--rule);border-radius:var(--radius);position:relative}
.mapbox svg{display:block;width:100%;height:clamp(300px,92vw,440px)}
.mapbox.mini svg{height:clamp(240px,55vw,340px)}
.map-cons{width:100%;border-left:2px solid var(--accent);padding:6px 10px;font-size:var(--step--1);color:var(--ink);background:var(--paper)}
svg .mk-code{font:500 3.3px var(--f-mono);fill:var(--ink)}
svg .mk-name{font:400 2.9px var(--f-body);fill:var(--muted)}
svg .mk-code,svg .mk-name{paint-order:stroke;stroke:var(--surface);stroke-width:.8px;stroke-linejoin:round}
svg .mk-ord{font:500 2.8px var(--f-mono);fill:var(--on-accent);stroke:none}
@media (max-width:599px){ svg .mk-code{font-size:4.1px} svg .mk-name{font-size:3.4px} svg .mk-ord{font-size:3.1px} }
.map-leg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;border-top:1px solid var(--rule);font-size:var(--step--2);color:var(--muted)}
.node[data-act]{cursor:pointer}
.node .hit{fill:transparent}
.node:hover .core{stroke-width:.9}
.arc{fill:none;stroke:var(--accent);stroke-width:.42;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){ .arc.draw{marker-end:none} }
.arc.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out forwards;animation-play-state:paused}
.mapbox.inview .arc.draw{animation-play-state:running}
@keyframes draw{to{stroke-dashoffset:0}}
svg .ghost{fill:none;stroke:var(--muted);stroke-width:.4;stroke-dasharray:1.6 1.2;opacity:.7}
svg .arc-cand{fill:none;stroke:var(--accent);stroke-width:.5;stroke-dasharray:1.2 1.2;opacity:.5}
.hq-pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.6s ease-out 3}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.mlist{display:grid;gap:0;border-top:1px solid var(--rule)}
.addrow .opt{gap:6px}
.addpair{display:inline-flex}
.addpair .opt:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.addpair .opt.info{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;min-width:36px;justify-content:center;font-family:var(--f-mono);color:var(--muted)}
.addpair .opt.info::before{display:none}
.mrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.mrow .nm{text-align:left;min-height:44px;display:flex;flex-direction:column;justify-content:center;font-size:var(--step--1)}
.mrow .nm b{font-weight:600}
.mrow .nm b::after{content:" ›";content:" ›" / "";color:var(--accent);font-weight:400}
.mrow .nm span{font-size:var(--step--2);color:var(--muted)}
.mrow .ord{font-family:var(--f-mono);color:var(--accent);text-align:center}
.ib{min-width:44px;min-height:44px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);font-size:var(--step--1);display:inline-grid;place-items:center;padding:0 8px}
.ib:disabled{opacity:.35;cursor:default}
.ib.txt{font-size:var(--step--2)}
.mrow .acts{display:flex;gap:4px}
.pip{font-family:var(--f-mono);font-size:var(--step--1)}
.pip.closed{color:var(--closed)} .pip.check{color:var(--check)} .pip.clear{color:var(--proof)}
.conseq{display:grid;gap:6px;font-size:var(--step--1)}
.conseq li{padding:8px 12px;background:var(--surface);border-left:2px solid var(--accent);font-family:var(--f-body);font-size:var(--step--1);line-height:1.6}
.conseq li:first-child{border-left-color:var(--ink)}
.rank{display:grid;gap:2px;font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
.rank li.in{color:var(--ink)}
.desk{border:1px solid var(--ink);border-radius:var(--radius);background:var(--surface);padding:18px;display:grid;gap:16px}
.desk .layer{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--rule)}
.desk .layer>.caps{display:flex;gap:8px;align-items:center}
.cond{display:grid;gap:4px;font-size:var(--step--1);padding:8px 0;border-bottom:1px dashed var(--rule)}
.cond:last-child{border-bottom:0}

/* gantt */
.gantt{display:grid;gap:6px;font-size:var(--step--2)}
.g-row{display:grid;grid-template-columns:minmax(64px,92px) minmax(0,1fr);gap:8px;align-items:center}
.g-lab{font-family:var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-track{position:relative;height:22px;background:linear-gradient(var(--rule),var(--rule)) 0 50%/100% 1px no-repeat}
.g-bar{position:absolute;top:3px;height:16px;border-radius:2px}
.g-prep{background:var(--hatch-bg),var(--surface);border:1px solid var(--rule-strong)}
.g-launch{background:var(--accent)}
.g-op{background:var(--accent-soft);border:1px solid var(--accent)}
.g-blocked{background:var(--hatch-bg),var(--closed-soft);border:1px dashed var(--closed)}
.g-er{background:var(--ink)}
.g-out{position:absolute;top:3px;right:0;height:16px;padding:0 6px;border-radius:2px;background:none;border:1px dashed var(--rule-strong);color:var(--muted);font-family:var(--f-mono);font-size:10px;line-height:14px;white-space:nowrap}
.g-ms{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--paper);border:1.5px solid var(--ink)}
.g-ticks{position:relative;height:18px;margin-left:calc(min(92px,24%) + 8px)}
.g-ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.g-ticks span:last-child{transform:translateX(-100%)}
.g-leg{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:var(--step--2)}
.g-leg i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.mslist{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
.gl-short{display:none}
@media (max-width:599px){ .gl-long{display:none} .gl-short{display:inline} }

/* tables → stacked key/value */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--step--1)}
.tbl.scope{font-size:var(--step--2);line-height:1.5}
.tbl.scope{table-layout:fixed}
.tbl.scope th:nth-child(1){width:15%} .tbl.scope th:nth-child(2){width:26%} .tbl.scope th:nth-child(3){width:12%} .tbl.scope th:nth-child(4){width:13%} .tbl.scope th:nth-child(5){width:22%} .tbl.scope th:nth-child(6){width:12%}
.tbl.scope td:nth-child(4){white-space:normal}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
.tbl th{font-family:var(--f-mono);font-size:var(--step--2);font-weight:500;letter-spacing:.06em;color:var(--muted);background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl .lead{color:var(--proof);font-family:var(--f-mono)}
.tbl td.ph{background:var(--hatch-bg) 0 0/5px 100% no-repeat,var(--surface);padding-left:16px;color:var(--muted);font-size:var(--step--2)}
.tbl.cmp{table-layout:fixed;font-size:var(--step--1)}
.tbl.cmp th:first-child{width:36%}
.tbl.cmp tbody th{font-family:var(--f-body);font-size:var(--step--1);letter-spacing:0;color:var(--ink);background:none;font-weight:400}
.tbl.cmp td,.tbl.cmp th{padding:8px}
@media (max-width:599px){
  .tbl-wrap:not(.cmpw){border:0;background:none;overflow:visible}
  table.tbl:not(.cmp),.tbl:not(.cmp) tbody,.tbl:not(.cmp) tr,.tbl:not(.cmp) td{display:block;width:100%}
  .tbl:not(.cmp) thead{display:none}
  .tbl:not(.cmp) tr{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);margin-bottom:8px}
  .tbl:not(.cmp) td{display:grid;grid-template-columns:minmax(84px,34%) minmax(0,1fr);gap:8px;border-bottom:1px solid var(--rule)}
  .tbl:not(.cmp) td::before{content:attr(data-l);font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
  .g-ticks{margin-left:calc(64px + 8px)}
  .g-ticks span.odd:not(:last-child){display:none}
  .g-row{grid-template-columns:64px minmax(0,1fr)}
  .g-ms{display:none}
}

/* modules */
.mods{display:grid;gap:10px}
.mod{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);padding:16px;display:grid;gap:10px}
.mod.on{border-color:var(--ink)}
.mod.off{background:transparent}
.mod-h{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.mod-h h4{font-family:var(--f-display);font-weight:700;font-size:var(--step-1)}
h2.h3{font-size:var(--step-1)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow>.caps{min-width:3.6em}
.mod .why{font-size:var(--step--1);color:var(--muted)}
.mod .gate{border-left:3px solid var(--check);padding:6px 10px;background:var(--check-soft);font-size:var(--step--1)}
.mod .price{font-size:var(--step--1);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.deliv{display:grid;gap:4px;font-size:var(--step--1)}
.deliv li{display:grid;grid-template-columns:64px 1fr;gap:8px}
.own{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted);border:1px solid var(--rule);border-radius:2px;text-align:center;height:fit-content;padding:1px 0}
.own.p{color:var(--ink);border-color:var(--ink)}
.toggle{min-height:44px;min-width:44px;padding:4px 12px;border:1px solid var(--rule-strong);border-radius:var(--radius);font-size:var(--step--2);font-family:var(--f-mono);display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.budgetbar{position:relative;height:30px;border:1px solid var(--rule-strong);border-radius:2px;background:var(--surface);margin-top:8px}
.bticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
.budgetbar .band{position:absolute;top:0;bottom:0;background:var(--proof-soft);box-shadow:inset 0 0 0 2px var(--proof)}
.budgetbar .rng{position:absolute;top:8px;height:12px;background:var(--ink);border-radius:2px}
.budgetbar.sample .rng{background:var(--hatch-bg),var(--rule-strong)}
.fitchips{display:flex;flex-wrap:wrap;gap:6px}
.sealed{display:grid;gap:10px}
@media (min-width:640px){ .sealed{grid-template-columns:repeat(2,minmax(0,1fr))} }
.env{border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--surface);overflow:hidden;display:grid}
.env .top{height:14px;background:var(--hatch-bg),var(--sunk);border-bottom:1px solid var(--rule)}
.env .bd{padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;font-size:var(--step--1)}
.env .cnt{font-family:var(--f-mono);font-size:var(--step-2);line-height:1}

/* §3B */
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:var(--step--1)}
.dots{display:inline-flex;gap:4px}
.dot{width:44px;height:44px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:var(--step--2)}
.dot[aria-checked="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot[aria-checked="true"][data-v="0"]{background:var(--surface);color:var(--muted);border-color:var(--rule-strong);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.crit[data-w="2"] .dot[data-v="1"],.crit[data-w="3"] .dot[data-v="1"],.crit[data-w="3"] .dot[data-v="2"]{background:var(--accent-soft);border-color:var(--accent)}
.lr.moved{animation:flash 1.6s ease-out}
.layer-rank{display:grid;gap:10px}
.lr{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.lr .bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px 12px;font-size:var(--step--2);color:var(--muted);margin-top:4px}
.lr .bars span b{letter-spacing:1px;color:var(--ink);font-family:var(--f-mono)}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.seat{border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px;font-size:var(--step--1);display:grid;gap:2px}
.seat.have{border-color:var(--ink)}
.seat.open{border-style:dashed}

/* handshake */
.hs-steps{display:grid;gap:4px}
.hs-card{border:2px solid var(--ink);border-radius:var(--radius);background:var(--surface);padding:18px;display:grid;gap:12px}
.hs-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.hs-side{border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px;font-size:var(--step--1)}
.hs-side.l{animation:inL .2s ease-out} .hs-side.r{animation:inR .2s ease-out}
@keyframes inL{from{transform:translateX(-14px);opacity:.3}} @keyframes inR{from{transform:translateX(14px);opacity:.3}}
.hs-x{font-family:var(--f-mono);font-size:var(--step-2)}

/* §5 */
.agenda{display:grid;gap:0;border-top:1px solid var(--rule)}
.ag{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.ag .n{font-family:var(--f-mono);color:var(--muted);font-size:var(--step--1)}

.sev{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
.times{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:3px;font-size:var(--step--2)}
.times .th{font-family:var(--f-mono);color:var(--muted);text-align:center;padding:4px 0}
.times .rh{font-family:var(--f-mono);color:var(--muted);padding-right:6px;display:flex;align-items:center}
.cell{min-height:44px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface);font-family:var(--f-mono);font-size:12px;line-height:1.25;padding:2px;display:grid;place-items:center;text-align:center}
.cell[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cell:disabled,.cell[aria-disabled="true"]{opacity:.4}
.cell.off:not([aria-pressed="true"]){background:var(--sunk);color:var(--muted)}
[aria-disabled="true"]{cursor:default}
.outs{display:flex;flex-wrap:wrap;gap:8px}
.addr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:var(--step--1)}
.addr .sel-t{user-select:all;-webkit-user-select:all;padding:6px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);min-width:0}

.sendrows{display:grid;gap:10px;margin-top:12px}
.sendrow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;align-items:start}
.sendrow .no{font-family:var(--f-mono);color:var(--muted);padding-top:10px}
.sendrow .bd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.sendrow .lab{font-size:var(--step--1);font-weight:600;width:100%}
.outs2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
ul.cols>li{break-inside:avoid;padding:3px 0}
@media (min-width:720px){ ul.cols{columns:2;column-gap:32px;display:block} }
.ladder{position:relative;display:grid;gap:0;padding-left:26px}
.ladder::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--rule-strong)}
.rung{position:relative;padding:6px 0;font-size:var(--step--1);display:grid;gap:2px}
.rung::before{content:"";position:absolute;left:-23px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1.5px solid var(--rule-strong)}
.rung.here::before{background:var(--accent);border-color:var(--accent)}
.rung.next::before{border-color:var(--ink)}
.rung .r{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
.ai{border:1px solid var(--rule-strong);border-radius:var(--radius);padding:16px;display:grid;gap:10px;background:var(--surface)}
.ai .lab{font-family:var(--f-mono);font-size:var(--step--2);color:var(--check);border-bottom:1px dashed var(--rule);padding-bottom:8px}
.ai .out{white-space:pre-wrap;font-size:var(--step--1);min-height:1.5em}
.fallback-pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:var(--step--2);background:var(--surface);border:1px solid var(--rule);padding:12px;max-height:280px;overflow:auto}

/* ── scope draft sheet ── */
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:22px 22px 18px;box-shadow:0 1px 0 var(--rule),0 12px 28px -18px rgba(20,23,28,.35)}
.lh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.lh .t{font-family:var(--f-mono);font-size:var(--step--2);letter-spacing:.14em}
.lh .r{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted)}
.sheet h3{margin-top:12px;font-size:var(--step-1)}
.sheet .co-line{font-size:var(--step--1);color:var(--muted)}
.slines{margin-top:12px;display:grid}
.sl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:var(--step--1);line-height:1.5}
.sl .k{font-family:var(--f-mono);font-size:var(--step--2);color:var(--muted);letter-spacing:.04em;padding-top:2px}
.sl sup{font-family:var(--f-mono);font-size:max(.68em,10.5px);color:var(--muted);margin-left:2px}
.sl.new{animation:rise .3s ease-out}
.sl.chg{animation:flash 1.6s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px);background:var(--accent-soft)}}
@keyframes flash{0%{background:var(--accent-soft);box-shadow:-8px 0 0 var(--accent-soft),8px 0 0 var(--accent-soft)}100%{background:transparent;box-shadow:none}}
.fns{margin-top:12px;display:grid;gap:2px;font-size:var(--step--2);color:var(--muted)}
.fns li{display:grid;grid-template-columns:18px 1fr}
.fns li span{font-family:var(--f-mono)}
.sheet .empty{padding:28px 0 18px;color:var(--muted);font-size:var(--step--1)}
.sheet .foot .fns{margin:0;display:flex;flex-wrap:wrap;gap:2px 12px}
.sheet .foot .fns li{display:inline-flex;gap:4px}
@media (min-width:1024px){ .sheet-wrap .sheet .sl{padding:6px 0;grid-template-columns:76px minmax(0,1fr)} .sheet-wrap .sheet>h3,.sheet-wrap .sheet>.co-line{display:none} }
.sheet .foot{margin:14px -22px -18px;padding:12px 22px 18px;display:grid;gap:8px;position:sticky;bottom:0;z-index:1;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -10px 14px -12px rgba(20,23,28,.25)}
.pid{font-family:var(--f-mono);font-size:var(--step--2);word-break:break-all;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:var(--paper);padding:0 16px env(safe-area-inset-bottom,0px)}
.bar button{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:var(--step--1);text-align:left}
.bar .mono{font-size:var(--step--2);opacity:.85}
.bar button:focus-visible{outline:2px solid var(--paper);outline-offset:-4px}
.bar .n{display:inline-block}
.bar button>span:first-child{flex:1 1 0;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar button>.mono{flex:0 1 auto;min-width:0;max-width:52%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .tick{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.dlg{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0}
.dlg .dlg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#sheetDlg .dlg-h{position:sticky;top:calc(-12px - env(safe-area-inset-top,0px));z-index:2;background:var(--paper);margin-inline:-16px;padding:8px 16px}
#sheetDlg .sheet .foot{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#cfb{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius);font-size:var(--step--1);max-width:calc(100vw - 32px);pointer-events:none;opacity:0;transition:opacity .15s}
.toast.on{opacity:1}
@media (min-width:1024px){ .only-phone{display:none!important} }
@media (min-width:1024px){ .toast{bottom:24px} }

/* review */
.review-h{padding-block:36px 8px;display:grid;gap:8px}
.review-h h1{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.review-h h1 .h1-ref{display:block;margin-top:6px;font-size:var(--step--1);font-weight:400;color:var(--muted);letter-spacing:.02em;white-space:nowrap}

.doc{display:grid;gap:28px;padding-bottom:48px}
.sumbox{border:4px double var(--accent);background:var(--surface);padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

}

  HIDE.cases.clear(); HIDE.facts.clear(); HIDE.sealedCounts.clear(); HIDE.sampleRates = false; HIDE.price = false;
  CONFIG.cases.forEach(c => { if ((c.kpi === "pipeline_usd" || c.kpi === "inst_leads") && !(c.qualifier && c.qualifier.en)) { add("block", "cases." + c.id + ".qualifier", "기관 지표 사례에 원문 단서가 없습니다", "Institutional-metric case lacks its qualifier"); HIDE.cases.add(c.id); } });
  const P = CONFIG.prospect;
  if (P && !P.fictional) {
    (P.facts || []).forEach((f, i) => { if (!f.source || !f.asOf) { add("block", "prospect.facts[" + i + "]", "출처와 기준일이 없는 사실입니다", "Fact lacks source and as-of date"); HIDE.facts.add(i); } });
    (P.sealed || []).forEach((s, i) => { if (s.count != null && s.prepared !== true) { add("block", "prospect.sealed[" + i + "]", "준비되지 않은 봉인 항목에 개수가 있습니다", "Sealed count without prepared:true"); HIDE.sealedCounts.add(i); } });
  }
  const lists = { sectors: CONFIG.sectors, audiences: CONFIG.audiences, kpis: CONFIG.kpis, cases: CONFIG.cases, markets: CONFIG.markets, modules: CONFIG.modules,
    counterparts: CONFIG.counterparts, myNeeds: CONFIG.myNeeds, pilotFormats: CONFIG.pilotFormats, campaigns: CONFIG.campaigns,
    criteria: CONFIG.institution.criteria, categories: CONFIG.institution.categories.items };
  for (const k in lists) { const seen = new Set(); lists[k].forEach(x => { if (seen.has(x.n)) add("block", k + ".n=" + x.n, "중복된 n 값입니다", "Duplicate enum n"); seen.add(x.n); }); }
  const kk = Object.keys(STRINGS.ko), ke = Object.keys(STRINGS.en);
  kk.filter(k => !(k in STRINGS.en)).concat(ke.filter(k => !(k in STRINGS.ko))).forEach(k => add("block", "STRINGS." + k, "KO/EN 키가 맞지 않습니다", "KO/EN key parity failure"));
  kk.forEach(k => { const a = STRINGS.ko[k], b = STRINGS.en[k]; if (Array.isArray(a) !== Array.isArray(b) || (Array.isArray(a) && a.length !== b.length)) add("block", "STRINGS." + k, "KO/EN 항목 수가 다릅니다", "KO/EN option count differs"); });
  if (CONFIG.sampleRates && CONFIG.meta.mode === "live") { add("block", "sampleRates", "live 모드에 예시 요율이 남아 있습니다", "sampleRates present while mode is live"); HIDE.sampleRates = true; }
  CONFIG.cases.filter(c => c.attribution === "pending").forEach(c => add("warn", "cases." + c.id + ".attribution", "고객사 표기 확인 중: " + c.display + " · panasia.io에서 이 수치 옆의 고객사 표기를 확인합니다", "Attribution pending: " + c.display + " · confirm the client label printed next to this figure on panasia.io"));
  const eraU = CONFIG.cases.filter(c => c.era === "unconfirmed").map(c => c.id);
  if (eraU.length) add("warn", "cases[].era", "수행 시기 미확정 " + eraU.length + "건: " + eraU.join(", "), eraU.length + " cases with era unconfirmed: " + eraU.join(", "));
  CONFIG.cases.filter(c => c.marketToConfirm).forEach(c => add("warn", "cases." + c.id + ".market", "시장 확인 필요 (" + c.marketToConfirm + "로 추정)", "Market to confirm (likely " + c.marketToConfirm + ")"));
  CONFIG.cases.filter(c => c.recheck).forEach(c => add("warn", "cases." + c.id + ".recheck", "표기 재확인: " + c.display + " · panasia.io에서 고객사 표기를 다시 확인합니다", "Re-check label: " + c.display + " · confirm the client label on panasia.io"));
  const tr = CONFIG.cases.filter(c => c.label && c.label.koStatus === "translated").map(c => c.id);
  if (tr.length) add("warn", "cases[].label.koStatus", "번역한 국문 라벨 " + tr.length + "건 (사이트 국문 원문으로 교체)", tr.length + " KO labels are translations (replace with site copy)");
  const tq = CONFIG.cases.filter(c => c.qualifier && c.qualifier.koStatus === "translated").map(c => c.id);
  if (tq.length) add("warn", "cases[].qualifier.koStatus", "번역한 국문 단서 " + tq.length + "건: " + tq.join(", ") + " (사이트 국문 원문으로 교체)", tq.length + " KO qualifiers are translations: " + tq.join(", ") + " (replace with site copy)");
  if (CONFIG.meta.copyKoStatus === "translated") add("warn", "meta.copyKoStatus", "국문 h1·리드는 번역본입니다 (사이트 국문 헤드라인으로 교체)", "KO h1 and lede are translations (replace with the site's Korean headline)");
  add("warn", "meta.contact", CONFIG.meta.contact + "가 사업 문의 창구인지 확인 필요 (확인된 것은 언론·인터뷰 창구)", "Confirm " + CONFIG.meta.contact + " handles business inquiries (confirmed only for media and interviews)");
  add("warn", "cases[].display", "모든 수치·라벨·단서를 panasia.io 원문과 대조 필요 (검색 요약에서 수집)", "Check every figure, label and qualifier verbatim on panasia.io (gathered from search summaries)");
  // DSL keys that are not evaluated where they are used would silently never fire
  CONFIG.rules.A.concat(CONFIG.rules.B).forEach((r, i) => { const ks = Object.keys(r.when || {}).filter(k => k === "routeHas" || k === "modules"); if (ks.length) add("warn", "rules[" + i + "].when", ks.join(", ") + " 키는 모듈 추천 단계에서 평가되지 않습니다", ks.join(", ") + " is not evaluated when modules are recommended"); });
  CONFIG.conditions.forEach(c => [c.if, c.ifUnsure].forEach(w => { if (w && "routeHas" in w) add("warn", "conditions." + c.id, "routeHas 키는 시장 조건 단계에서 평가되지 않습니다", "routeHas is not evaluated when market conditions are checked"); }));
  CONFIG.conditions.forEach(c => {
    if (c.kind === "desk-note") return;
    const src = c.source && CONFIG.sources[c.source.ref];
    const issues = []; if (!c.verified) issues.push("unverified"); if (!src || !src.url) issues.push("no URL"); if (!c.source || !c.source.asOf) issues.push("no as-of");
    else if (ageDays(c.source.asOf) > (c.staleAfterDays ?? CONFIG.meta.staleAfterDaysDefault)) issues.push("stale");
    if (issues.length) add("warn", "conditions." + c.id, "조건 미검증: " + issues.join(", "), "Condition not verified: " + issues.join(", "));
  });
  const nv = CONFIG.markets.filter(m => m.view && m.view.approved === false).map(m => m.code);
  if (nv.length) add("warn", "markets[].view.approved", "운영 맥락 문구 미승인: " + nv.join(", "), "Market views not approved: " + nv.join(", "));
  if (CONFIG.meta.rates.status === "unset") add("warn", "meta.rates.status", "요율 미설정 · 가격은 표시하지 않습니다", "Rates unset · no prices render");
  if (CONFIG.meta.canonicalUrl == null) add("warn", "meta.canonicalUrl", "canonicalUrl 미설정 · 공유 링크 대신 Plan ID 안내문을 복사합니다", "canonicalUrl null · share link copies Plan ID instructions");
  if (CONFIG.research.titles.some(x => x == null)) add("warn", "research.titles", "논문 제목 미입력", "Research titles missing");
  CONFIG.cases.filter(c => c.legalReview === "pending").forEach(c => add("warn", "cases." + c.id + ".legalReview", "거래소 사례 문구 법률 검토 대기", "Exchange-case wording awaiting legal review"));
  CONFIG.activities.filter(a => !a.verified).forEach(a => add("warn", "activities." + a.id, "활동 미검증 · 표시하지 않습니다", "Activity unverified · not shown"));
  if (CONFIG.offers.entryReview.fee.some(x => x == null)) add("warn", "offers.entryReview.fee", "Entry Review 고정 비용 미설정", "Entry Review fee not set");
  if (CONFIG.offers.adoptionDiagnostic.fee.some(x => x == null)) add("warn", "offers.adoptionDiagnostic.fee", "도입 진단 고정 비용 미설정", "Adoption Diagnostic fee not set");

  if (CONFIG.meta.rates.status === "range" && [CONFIG.offers.entryReview.fee, CONFIG.offers.adoptionDiagnostic.fee].some(f => f.some(x => x == null))) { add("block", "offers.fee", "요율 범위가 켜져 있지만 출발점 고정 비용이 비어 있습니다 · 가격을 표시하지 않습니다", "Rates are on but an R2 fee is missing · no price renders"); HIDE.price = true; }
  return F;
}

// ═══════════════════════════════════════════════════════════════════════════
// derive(CONFIG, STATE)
// ═══════════════════════════════════════════════════════════════════════════
function derive(S) {
  const ctx0 = ctxOf(S);
  const rec = recommendModules(ctx0);
  const mods = selectedIds(S, rec, ctx0);
  const ctx = ctxOf(S, { modules: mods });
  const desks = {}; CONFIG.markets.forEach(m => desks[m.code] = deskStatus(m, ctx, mods));
  const ranked = rankMarkets(desks);
  const auto = S.track === 2 ? [homeCode(S)] : autoRoute(S, ranked, desks, mods);
  // a decoded plan keeps the route its sender saw (lockedRoute) until the flow is edited; CONFIG or date drift never re-routes a shared ID
  const locked = S.lockedRoute && S.lockedRoute.length ? S.lockedRoute.filter(c => MKT[c]).slice(0, 4) : null;
  const route = S.track === 2 ? [homeCode(S)] : (S.routeOverridden ? S.route.filter(c => MKT[c]).slice(0, 4) : locked || auto);
  ctx.route = route;
  const cases = matchCases(ctx, mods, route);
  const cov = evidenceCoverage(route, mods, desks, ctx);
  const sched = schedule(S, route, mods, desks);
  const pr = price(S, route, mods, sched);
  const P = prospectCtx();
  const r14 = S.track < 2 && r14Ctx(ctx);
  // display order: R14 keeps exchange cases out of the matches; within the top three, confirmed attributions lead and pending ones follow
  const shown = S.track < 2 ? cases.filter(x => !(r14 && x.c.exchangeOnly)) : cases;
  const ordered = S.track < 2 ? [...confirmedFirst(shown.slice(0, 3)), ...shown.slice(3)] : shown;
  const D = { ctx, rec, mods, desks, ranked, auto, route, cases: ordered, r14, top: ordered,
    matched: S.track < 2 ? ordered.filter(x => x.why.some(w => STRONG_WHY.includes(w))) : ordered.filter(x => x.why.length), cov, sched, price: pr,
    fit: budgetFit(pr, S.budget), proof: S.track < 2 ? proofLine(S, ctx) : null, hs: S.track === 1 ? handshake(S.handshake) : null,
    diffs: P ? diffVsProposal(S, route, mods, P) : [], noRoute: S.track < 2 && !S.routeOverridden && !locked && auto.length === 0 };
  D.pins = S.pins.map(id => CASES[id]).filter(c => c && visibleCase(c, ctx) && !(r14 && c.exchangeOnly));
  D.questions = questions(S, D, P);
  D.layer = S.track === 2 ? layerFit(S.b.weights) : null;
  D.sens = S.track === 2 ? layerSensitivity(S.b.weights) : null;
  D.clearK = CONFIG.markets.filter(m => desks[m.code].status === "clear").length;
  D.recProg = rec.ids.filter(id => !MODS[id].r2);
  return D;
}

// ── map ──
// quadratic arc between two markets; the bow side is chosen so the curve keeps clear of the other market nodes
function arcPath(a, b, others) {
  const [x0, y0] = a, [x1, y1] = b, mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0;

  // gentlest bow that clears other nodes and labels by ~4 units; otherwise the one with the most clearance
  let best = ctrl(0.18), bestC = -1;

  return { d: `M${sx.toFixed(2)},${sy.toFixed(2)} Q${cx.toFixed(2)},${cy.toFixed(2)} ${ex.toFixed(2)},${ey.toFixed(2)}`, mid: [0.25 * sx + 0.5 * cx + 0.25 * ex, 0.25 * sy + 0.5 * cy + 0.25 * ey] };
}
// obstacles: every other node and the middle of its label, so arcs do not run through a market or its name
const arcBetween = (p, q) => arcPath(MKT[p].pos, MKT[q].pos, CONFIG.markets.filter(m => m.code !== p && m.code !== q).flatMap(m => [m.pos, [m.pos[0] + (m.lab === "l" ? -6 : 6), m.pos[1] + 1.5]]));

// ── gantt ──
function ganttHTML(sch) {
  const H = sch.H, pc = w => Math.max(0, Math.min(100, w / H * 100));
  const phCls = ["g-er", "g-prep", "g-launch", "g-op"], phSty = ["background:var(--ink)", "background:var(--hatch-bg),var(--surface);border:1px solid var(--rule-strong)", "background:var(--accent)", "background:var(--accent-soft);border:1px solid var(--accent)"];

  const lab = (long, short) => `<span class="g-lab" title="${esc(long)}"><span class="gl-long">${esc(long)}</span><span class="gl-short" aria-hidden="true">${esc(short)}</span></span>`;

    sch.phases.forEach((p, i) => { rows += `<div class="g-row">${lab(L(p.p), L(p.p))}<div class="g-track">${bar(phCls[i] || "g-launch", p.start, p.end, L(p.p))}</div></div>`; said.push(L(p.p) + " " + p.start + "–" + (p.p.weeks ? p.end : "") + (LANG === "ko" ? "주" : " wks")); });
  } else {
    rows += `<div class="g-row">${lab(t("ms.er"), "ER")}<div class="g-track">${dia(0, t("ms.scope"))}${bar("g-er", sch.erStart, sch.erEnd, t("ms.er"))}</div></div>`;

    const wks = (a, b) => a + "–" + b + (LANG === "ko" ? "주" : " wks");
    sch.markets.forEach(x => {
      const ms = sch.ms.filter(m => m.code === x.code).map(m => dia(m.at, t(m.k))).join("");
      let track = x.blocked ? bar("g-blocked", x.start, x.start + x.prep, t("ganttBlocked")) : bar("g-prep", x.start, x.launchAt, t("g.prep")) + bar("g-launch", x.launchAt, x.end, t("g.launch")) + (x.monthly ? bar("g-op", x.end, H, t("g.op")) : "");
      if (x.clipped) track = `<span class="g-out">${esc(t("beyondH"))} →</span>`;    // starts after the horizon: say so instead of an empty track
      rows += `<div class="g-row">${lab(x.code + " " + mName(x.code), x.code)}<div class="g-track">${track}${x.blocked ? "" : ms}</div></div>`;
      said.push(x.code + ": " + (x.clipped ? t("beyondH") : x.blocked ? t("ganttBlocked") : t("g.prep") + " " + wks(x.start, x.launchAt) + (x.end > x.launchAt ? ", " + t("g.launch") + " " + wks(x.launchAt, x.end) : "") + (x.monthly ? ", " + t("g.op") + " " + x.end + (LANG === "ko" ? "주~" : " wks~") : "")));

  const msl = sch.ms.length ? `<details class="dis" id="d-ms"${isOpen("d-ms") ? " open" : ""}><summary>${esc(t("msDetails"))} · ${sch.ms.length}</summary><div class="dbody"><ul class="mslist">${sch.ms.map(m => `<li>◆ ${esc(t(m.k))} · ${m.code} · ${esc(t("weekAt", { n: m.at }))}</li>`).join("")}</ul></div></details>` : "";
