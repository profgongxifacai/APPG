<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="t3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363C"/><stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="t3-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t3-silver" x1="0" y1="31" x2="0" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#C7CCD4"/><stop offset=".48" stop-color="#4B5059"/>
      <stop offset=".6" stop-color="#EEF1F5"/><stop offset=".82" stop-color="#9AA0A9"/><stop offset="1" stop-color="#565B63"/>
    </linearGradient>
    <linearGradient id="t3-gold" x1="0" y1="31" x2="0" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4D2"/><stop offset=".22" stop-color="#F3C566"/><stop offset=".48" stop-color="#7A4A12"/>
      <stop offset=".6" stop-color="#FFE3A0"/><stop offset=".82" stop-color="#D49A3A"/><stop offset="1" stop-color="#7E5318"/>
    </linearGradient>
    <clipPath id="t3-top"><rect x="42" y="26" width="16" height="22"/></clipPath>
    <filter id="t3-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="t3-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t3-bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#t3-sheen)"/>
  <g fill="none" stroke="#000" stroke-width="10" opacity=".6" filter="url(#t3-blur3)" transform="translate(0 4)">
    <circle cx="39" cy="50" r="15"/><circle cx="61" cy="50" r="15"/>
  </g>
  <!-- silver link (A) -->
  <circle cx="39" cy="50" r="15" fill="none" stroke="url(#t3-silver)" stroke-width="9"/>
  <circle cx="39" cy="50" r="10.5" fill="none" stroke="#2A2D33" stroke-width=".8" opacity=".6"/>
  <!-- gold link (B) -->
  <circle cx="61" cy="50" r="15" fill="none" stroke="url(#t3-gold)" stroke-width="9"/>
  <circle cx="61" cy="50" r="10.5" fill="none" stroke="#4A2C08" stroke-width=".8" opacity=".6"/>
  <!-- silver over gold at top crossing -->
  <g clip-path="url(#t3-top)">
    <circle cx="39" cy="50" r="15" fill="none" stroke="#000" stroke-width="12" opacity=".45" filter="url(#t3-blur1)"/>
    <circle cx="39" cy="50" r="15" fill="none" stroke="url(#t3-silver)" stroke-width="9"/>
  </g>
  <!-- speculars -->
  <path d="M28 40 A15 15 0 0 1 36 35.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9" filter="url(#t3-blur1)"/>
  <path d="M64 35.3 A15 15 0 0 1 72 40" fill="none" stroke="#FFF7DF" stroke-width="2" stroke-linecap="round" opacity=".85" filter="url(#t3-blur1)"/>
</svg>
