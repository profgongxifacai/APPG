<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="t6-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11414A"/><stop offset="1" stop-color="#05161B"/>
    </linearGradient>
    <radialGradient id="t6-bgglow" cx="50" cy="52" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FD3C4" stop-opacity=".35"/><stop offset="1" stop-color="#2FD3C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t6-top" x1="0" y1="25" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8FFFB" stop-opacity=".75"/><stop offset="1" stop-color="#7FE7DA" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="t6-left" x1="29" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ED6CA" stop-opacity=".45"/><stop offset="1" stop-color="#2AA7A0" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="t6-right" x1="50" y1="0" x2="71" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14716F" stop-opacity=".45"/><stop offset="1" stop-color="#0B4A4C" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="t6-core" cx="50" cy="51" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4E8"/><stop offset=".4" stop-color="#FFA36C"/><stop offset="1" stop-color="#FF5A4E" stop-opacity="0"/>
    </radialGradient>
    <filter id="t6-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="t6-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".9"/></filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t6-bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#t6-bgglow)"/>
  <ellipse cx="50" cy="78" rx="22" ry="4" fill="#000" opacity=".6" filter="url(#t6-blur3)"/>
  <!-- glowing core cube -->
  <circle cx="50" cy="51" r="14" fill="#FF7A59" opacity=".55" filter="url(#t6-blur3)"/>
  <g>
    <path d="M50 41 L58.7 46 L50 51 L41.3 46 Z" fill="#FFE2C8"/>
    <path d="M41.3 46 L50 51 V61 L41.3 56 Z" fill="#FF9A68"/>
