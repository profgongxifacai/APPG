    <path d="M29.2 38 L50 50 L70.8 38 M50 50 V74" stroke="#E8FFFB" stroke-width="1" opacity=".9"/>
    <path d="M50 26 L70.8 38 V62 L50 74 L29.2 62 V38 Z" stroke="#9FF2E7" stroke-width=".8" opacity=".75"/>
    <path d="M31 38.4 L50 27.4 L60 33.2" stroke="#fff" stroke-width="1.4" opacity=".9" filter="url(#t6-blur1)"/>
