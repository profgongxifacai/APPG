<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="t5-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F2E8"/><stop offset="1" stop-color="#E2D7C3"/>
    </linearGradient>
    <radialGradient id="t5-jade" cx="50" cy="50" r="30" fx="40" fy="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9F2D6"/><stop offset=".35" stop-color="#8FCB9E"/><stop offset=".75" stop-color="#3E8C6A"/><stop offset="1" stop-color="#1F5A46"/>
    </radialGradient>
    <radialGradient id="t5-inner" cx="50" cy="50" r="30" gradientUnits="userSpaceOnUse">
      <stop offset=".25" stop-color="#C8F5D2" stop-opacity=".0"/><stop offset=".45" stop-color="#C8F5D2" stop-opacity=".35"/><stop offset=".6" stop-color="#C8F5D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t5-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#174A39"/><stop offset=".4" stop-color="#2E7457"/><stop offset="1" stop-color="#123A2D"/>
    </linearGradient>
    <filter id="t5-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="t5-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
    <clipPath id="t5-disc"><path d="M50 20 A30 30 0 1 1 49.99 20 Z M50 40 A10 10 0 1 0 50.01 40 Z" clip-rule="evenodd"/></clipPath>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t5-bg)"/>
  <ellipse cx="51" cy="56" rx="30" ry="29" fill="#5B4A2E" opacity=".35" filter="url(#t5-blur3)"/>
  <!-- thickness -->
  <path d="M50 23 A30 30 0 1 1 49.99 23 Z M50 43 A10 10 0 1 0 50.01 43 Z" fill="url(#t5-side)" fill-rule="evenodd"/>
  <!-- face -->
  <path d="M50 20 A30 30 0 1 1 49.99 20 Z M50 40 A10 10 0 1 0 50.01 40 Z" fill="url(#t5-jade)" fill-rule="evenodd"/>
  <g clip-path="url(#t5-disc)">
    <circle cx="50" cy="50" r="30" fill="url(#t5-inner)"/>
    <!-- hole inner wall shadow -->
    <circle cx="50" cy="52.5" r="10.5" fill="none" stroke="#0F3326" stroke-width="2.2" opacity=".45" filter="url(#t5-blur1)"/>
    <!-- carved ring -->
    <circle cx="50" cy="50" r="20" fill="none" stroke="#1F5A46" stroke-width=".9" opacity=".45"/>
    <circle cx="50" cy="50.6" r="20" fill="none" stroke="#E6FFE9" stroke-width=".6" opacity=".55"/>
    <!-- specular -->
    <path d="M28 38 A25 25 0 0 1 44 23.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85" filter="url(#t5-blur1)"/>
    <ellipse cx="66" cy="72" rx="7" ry="3" fill="#BFF0C8" opacity=".35" filter="url(#t5-blur1)" transform="rotate(-35 66 72)"/>
  </g>
</svg>
