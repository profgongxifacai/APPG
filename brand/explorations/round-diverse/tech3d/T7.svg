<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="t7-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7E5EC"/>
    </linearGradient>
    <linearGradient id="t7-face" x1="0" y1="22" x2="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A47"/><stop offset=".55" stop-color="#E5262E"/><stop offset="1" stop-color="#C0111F"/>
    </linearGradient>
    <linearGradient id="t7-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A0612"/><stop offset=".4" stop-color="#A50E1C"/><stop offset="1" stop-color="#5E030C"/>
    </linearGradient>
    <linearGradient id="t7-gloss" x1="0" y1="22" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="t7-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="t7-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".7"/></filter>
    <clipPath id="t7-top"><rect x="24" y="22" width="52" height="52" rx="13"/></clipPath>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t7-bg)"/>
  <rect x="24" y="30" width="52" height="54" rx="14" fill="#5A0A14" opacity=".35" filter="url(#t7-blur3)"/>
  <!-- block thickness -->
  <rect x="24" y="29" width="52" height="52" rx="13" fill="url(#t7-side)"/>
  <!-- top face -->
  <rect x="24" y="22" width="52" height="52" rx="13" fill="url(#t7-face)"/>
  <g clip-path="url(#t7-top)">
    <path d="M24 22 H76 V40 Q50 46 24 40 Z" fill="url(#t7-gloss)"/>
    <!-- carved P monogram (seal chop) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
      <path d="M41 63 V35 H53 Q62 35 62 44 Q62 53 53 53 H41" stroke="#FFD9CF" transform="translate(0 .9)" opacity=".5"/>
      <path d="M41 63 V35 H53 Q62 35 62 44 Q62 53 53 53 H41" stroke="#6E0410"/>
    </g>
    <path d="M28 30 Q30 25.5 36 25" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".9" filter="url(#t7-blur1)"/>
  </g>
</svg>
