<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="t2-bg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FF7A57"/><stop offset="1" stop-color="#D9283F"/>
    </linearGradient>
    <linearGradient id="t2-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="t2-ball" cx="50" cy="52" r="22" fx="42" fy="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6EFE8"/><stop offset=".88" stop-color="#E2D3C6"/><stop offset="1" stop-color="#C9B3A3"/>
    </radialGradient>
    <linearGradient id="t2-ring" x1="16" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1C9"/><stop offset=".35" stop-color="#F2C46A"/><stop offset=".7" stop-color="#B9771F"/><stop offset="1" stop-color="#FFE3A0"/>
    </linearGradient>
    <clipPath id="t2-back"><rect x="0" y="0" width="100" height="52"/></clipPath>
    <clipPath id="t2-front"><rect x="0" y="52" width="100" height="48"/></clipPath>
    <filter id="t2-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="t2-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t2-bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#t2-sheen)"/>
  <ellipse cx="53" cy="79" rx="20" ry="4.5" fill="#6E0B1C" opacity=".55" filter="url(#t2-blur3)"/>
  <!-- ring back -->
  <g transform="rotate(-20 50 52)">
    <ellipse cx="50" cy="52" rx="34" ry="9" fill="none" stroke="url(#t2-ring)" stroke-width="3.4" clip-path="url(#t2-back)" opacity=".9"/>
  </g>
  <circle cx="50" cy="52" r="22" fill="url(#t2-ball)"/>
  <!-- ring shadow on sphere -->
  <g transform="rotate(-20 50 52)">
    <ellipse cx="50" cy="55" rx="30" ry="8" fill="none" stroke="#8A4A2E" stroke-width="2.4" opacity=".22" filter="url(#t2-blur1)" clip-path="url(#t2-front)"/>
  </g>
  <ellipse cx="42" cy="42" rx="7" ry="4.5" fill="#fff" opacity=".9" filter="url(#t2-blur1)" transform="rotate(-30 42 42)"/>
  <!-- ring front -->
  <g transform="rotate(-20 50 52)">
    <ellipse cx="50" cy="52" rx="34" ry="9" fill="none" stroke="url(#t2-ring)" stroke-width="3.4" clip-path="url(#t2-front)"/>
    <ellipse cx="50" cy="51.2" rx="34" ry="9" fill="none" stroke="#fff" stroke-width=".8" opacity=".55" clip-path="url(#t2-front)"/>
  </g>
</svg>
