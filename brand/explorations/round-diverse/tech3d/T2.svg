<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="t2-bg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#E8473A"/><stop offset="1" stop-color="#A3122B"/>
    </linearGradient>
    <linearGradient id="t2-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="t2-ball" cx="50" cy="50" r="25" fx="41" fy="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F7F1EA"/><stop offset=".86" stop-color="#E0D0C2"/><stop offset="1" stop-color="#B99C8A"/>
    </radialGradient>
    <linearGradient id="t2-gold" x1="25" y1="0" x2="75" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8701E"/><stop offset=".3" stop-color="#FFE7A6"/><stop offset=".6" stop-color="#E0A23C"/><stop offset="1" stop-color="#8A5814"/>
    </linearGradient>
    <clipPath id="t2-clip"><circle cx="50" cy="50" r="25"/></clipPath>
    <filter id="t2-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="t2-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="t2-blur05" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".5"/></filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t2-bg)"/>
  <rect width="100" height="100" rx="22" fill="url(#t2-sheen)"/>
  <ellipse cx="52" cy="79" rx="21" ry="4.5" fill="#4A0612" opacity=".6" filter="url(#t2-blur3)"/>
  <circle cx="50" cy="50" r="25" fill="url(#t2-ball)"/>
  <g clip-path="url(#t2-clip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- seam groove shadow -->
    <path d="M23 47 C31 51 36 58 44 53 C50 49 52 43 59 47 C65 50.5 70 56 78 52" stroke="#5B3A1E" stroke-width="4.2" opacity=".25" filter="url(#t2-blur05)" transform="translate(0 1)"/>
    <!-- gold seam -->
    <path d="M23 47 C31 51 36 58 44 53 C50 49 52 43 59 47 C65 50.5 70 56 78 52" stroke="url(#t2-gold)" stroke-width="3.4"/>
    <path d="M44 53 L47 59.5 M59 47 L62.5 41.5" stroke="url(#t2-gold)" stroke-width="1.6"/>
    <path d="M30 49.6 C35 52.8 38 55.6 43 52.4" stroke="#FFF6D6" stroke-width=".9" opacity=".9"/>
    <!-- sphere specular -->
    <ellipse cx="40" cy="36" rx="8" ry="4.6" fill="#fff" opacity=".95" filter="url(#t2-blur1)" transform="rotate(-32 40 36)"/>
    <circle cx="50" cy="50" r="25" stroke="#8C5A47" stroke-width="2" opacity=".25" filter="url(#t2-blur1)"/>
  </g>
</svg>
